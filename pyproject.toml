[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astromechos-imager"
version = "0.1.0"
description = "Two-card SD imager for the AstromechOS R2-D2 build."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "PySide6==6.7.*",
  "cryptography>=42",
  "pywin32>=306 ; sys_platform == 'win32'",
  "pyfatfs>=1.1",
  "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "hypothesis>=6.100",
  "syrupy>=4.6",
  "pyfakefs>=5.5",
  "ruff>=0.4",
  "mypy>=1.10",
  "pyright>=1.1.360",
  "Pillow>=10.0",
]

[project.scripts]
astromechos-imager = "astromechos_imager.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["astromechos_imager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM","ARG"]

[tool.mypy]
strict = true
packages = ["astromechos_imager.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: file-backed slow tests",
  "contract: drift detection vs firstboot_setup.sh",
]
