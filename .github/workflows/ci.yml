name: ci
# Manual-only: the workflow no longer runs on push / pull_request, only
# when the operator clicks "Run workflow" under the Actions tab. Keeps
# the pipeline available for on-demand checks without spamming the inbox
# on every commit. Re-add `push` / `pull_request` triggers when the lint
# backlog is cleared and CI should gate merges again.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      # Lint steps are NON-BLOCKING until the lint backlog is cleared.
      # Current backlog (snapshot 2026-05-30): 323 ruff + 72 mypy errors,
      # tracked separately. Step logs stay red so the debt is visible,
      # but the workflow no longer triggers failure emails on every push.
      - name: Lint (ruff) — non-blocking, see backlog
        continue-on-error: true
        run: ruff check . --statistics
      - name: Lint (mypy) — non-blocking, see backlog
        continue-on-error: true
        run: mypy
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -n auto --cov=astromechos_imager --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
