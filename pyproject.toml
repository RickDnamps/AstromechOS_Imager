[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astromechos-imager"
# Single source of truth = astromechos_imager/__init__.py::__version__
# (the CLI and the GUI provenance stamp both read it; a literal here would
# be a fourth copy that drifts at the first bump).
dynamic = ["version"]
description = "Two-card SD imager for the AstromechOS R2-D2 build."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "PySide6==6.7.*",
  "cryptography>=42",
  "pywin32>=306 ; sys_platform == 'win32'",
  "pyfatfs>=1.1",
  "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "hypothesis>=6.100",
  "syrupy>=4.6",
  "pyfakefs>=5.5",
  "ruff>=0.4",
  "mypy>=1.10",
  "pyright>=1.1.360",
  "Pillow>=10.0",
]

[project.scripts]
astromechos-imager = "astromechos_imager.cli.main:main"

[tool.hatch.version]
path = "astromechos_imager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["astromechos_imager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM","ARG"]

[tool.ruff.lint.per-file-ignores]
# Test fakes/stubs must mirror Protocol & Qt signatures exactly (and pytest
# fixtures like `qtbot` are requested for their side effects) — renaming the
# unused params would hurt readability without catching real bugs.
"tests/**" = ["ARG"]
# Dev tooling, not shipped runtime code: long diagnostic prints/commands.
"scripts/**" = ["E501"]
# Structural: stdout/stderr MUST be redirected to a file BEFORE PySide6 is
# imported (frozen console=False builds otherwise lose every Qt/QML error),
# so every import below that block necessarily trips E402.
"astromechos_imager/ui/app.py" = ["E402"]

[tool.mypy]
strict = true
packages = ["astromechos_imager.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: file-backed slow tests",
  "contract: drift detection vs firstboot_setup.sh",
]
